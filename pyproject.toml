[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivanalysis"
version = "0.1.0"
description = "Investment-viability analysis: SEC EDGAR + uploads -> finance metrics -> live-formula Excel + narrative report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
uploads = ["pdfplumber>=0.11", "pypdf>=4.0"]
test = ["pytest>=8.0"]

[project.scripts]
ivanalysis = "ivanalysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
